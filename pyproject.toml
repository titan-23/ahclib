[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "ahclib"
version = "0.1.0"
description = "Parallel execution and Optuna optimization tools for AHC"
readme = { file = "README.rst", content-type = "text/x-rst" }
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "titan23", email = "titan23.kyopuro@gmail.com" },
]
keywords = ["AtCoder", "AHC", "heuristic"]
dependencies = [
    "click>=8.1,<9",
]

[project.urls]
Homepage = "https://github.com/titan-23/ahclib"

[project.optional-dependencies]
test = [
    "optuna>=4.7,<5",
    "pandas>=2.3,<4",
]
vis = [
    "dash>=4.4,<5",
    "dash-ag-grid>=35.3,<36",
    "optuna>=4.7,<5",
    "pandas>=2.3,<4",
    "plotly>=6.5,<7",
    "scipy>=1.15,<2",
]
beam = [
    "dash>=4.4,<5",
    "dash-cytoscape>=1.0.2,<2",
    "plotly>=6.5,<7",
]
opt = [
    "kaleido>=1.3,<2",
    "optuna>=4.7,<5",
    "optuna-dashboard>=0.19,<0.21",
    "optunahub>=0.4,<0.5",
    "pandas>=2.3,<4",
    "plotly>=6.5,<7",
]
auto-sampler = [
    "cmaes>=0.11,<0.14",
    "scipy>=1.15,<2",
    "torch>=2.6,<3",
]
postgres = [
    "psycopg2-binary>=2.9,<3",
]
all = [
    "cmaes>=0.11,<0.14",
    "dash>=4.4,<5",
    "dash-ag-grid>=35.3,<36",
    "dash-cytoscape>=1.0.2,<2",
    "kaleido>=1.3,<2",
    "optuna>=4.7,<5",
    "optuna-dashboard>=0.19,<0.21",
    "optunahub>=0.4,<0.5",
    "pandas>=2.3,<4",
    "plotly>=6.5,<7",
    "psycopg2-binary>=2.9,<3",
    "scipy>=1.15,<2",
    "torch>=2.6,<3",
]

[tool.setuptools.packages.find]
include = ["ahclib*"]
exclude = ["ahclib-vis*", "tests*", "work*"]
namespaces = false

[tool.setuptools.package-data]
ahclib = ["assets/*"]

[tool.black]
line-length = 120
